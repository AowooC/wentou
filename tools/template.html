<!DOCTYPE html><html lang="{{HTML}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}"><meta name="keywords" content="{{KW}}">
<link rel="canonical" href="{{CANON}}">
<link rel="alternate" hreflang="zh-CN" href="https://wentou.onrender.com/"><link rel="alternate" hreflang="en" href="https://wentou.onrender.com/en/"><link rel="alternate" hreflang="x-default" href="https://wentou.onrender.com/en/">
<meta property="og:type" content="website"><meta property="og:site_name" content="问透 Wentou"><meta property="og:locale" content="{{OGLOCALE}}">
<meta property="og:title" content="{{OGT}}"><meta property="og:description" content="{{DESC}}"><meta property="og:url" content="{{CANON}}"><meta property="og:image" content="https://wentou.onrender.com/og.png"><meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{LDJSON}}</script>
<style>
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;max-width:1000px;margin:20px auto;padding:0 16px;color:#222;background:#f7f7fb}
h1{font-size:22px}h2{font-size:18px;border-left:4px solid #5b6cff;padding-left:8px}
textarea{width:100%;height:220px;font-size:14px;padding:8px;box-sizing:border-box}
button{background:#5b6cff;color:#fff;border:0;padding:8px 14px;border-radius:6px;margin:4px 4px 4px 0;cursor:pointer;font-size:14px}
button.g{background:#888}
.card{background:#fff;border-radius:8px;padding:12px 16px;margin:10px 0;box-shadow:0 1px 3px #0002}
#hl{white-space:pre-wrap;line-height:1.8;font-size:14px}
mark{padding:1px 2px;border-radius:3px;cursor:pointer}
.t-jump{background:#ffe08a}.t-confuse{background:#ffb3b3}.t-noreason{background:#c7e3ff}.t-undef{background:#d6f5c9}.t-abs{background:#f0c7ff}.t-self{background:#ffd3a8}
.tag{font-size:12px;padding:1px 6px;border-radius:10px;margin-right:6px}
.q{margin:8px 0}.q input{width:100%;padding:6px;box-sizing:border-box}
.ok{color:#1a8a3a}.mid{color:#c27c00}.bad{color:#c62828}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #ddd;padding:6px;vertical-align:top}th{background:#eef}
.note{font-size:12px;color:#666}.hero{background:#fff;border-radius:8px;padding:12px 18px;margin:10px 0}.hero h1{font-size:28px;margin:.2em 0}.hero small{font-size:14px;color:#888}.tag1{font-size:18px;color:#5b6cff;margin:.2em 0}footer{margin:20px 0}
#sw{float:right;font-size:14px}body:lang(en){font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif}</style></head><body>
<header class="hero">{{SWITCH}}<h1>问透 <small>Wentou</small></h1><p class="tag1">{{TAG}}</p>{{INTRO}}<p class="note">{{WHO}}</p></header>
<main><p class="note" id="mode">…</p><p class="note">{{L.steps}}</p>
<div class="card"><h2>{{L.s1}}</h2><textarea id="notes" placeholder="{{L.ph}}"></textarea>
<div>{{L.upload}}<input type="file" id="file" accept="image/png,image/jpeg,image/webp,application/pdf"> <span id="fst" class="note"></span></div>
<button id="loadSample3">{{L.sample3}}</button><button id="loadSample">{{L.sample1}}</button><button id="loadSample2">{{L.sample2}}</button><button id="analyze">{{L.analyze}}</button><button class="g" id="demo">{{L.demo}}</button></div>
<div class="card" id="s2" hidden><h2>{{L.s2}} <span id="cnt"></span></h2><div class="note" id="legend"></div><div id="hl"></div></div>
<div class="card" id="s3" hidden><h2>{{L.s3}}</h2><div id="qs"></div><button id="judge">{{L.judge}}</button></div>
<div class="card" id="s4" hidden><h2>{{L.s4}}</h2><div id="list"></div><button id="exp">{{L.copy}}</button><pre id="md" class="note" style="white-space:pre-wrap"></pre>
<div id="fb" class="card"><b>{{L.fbq}}</b><br><button id="fbY">{{L.yes}}</button><button id="fbN" class="g">{{L.no}}</button><br><input id="fbC" maxlength="500" placeholder="{{L.fbph}}" style="width:100%;padding:6px;box-sizing:border-box;margin-top:6px"><div id="fbS" class="note"></div></div></div></main>
<section class="card"><h2>{{L.faqh}}</h2>{{FAQ}}</section>
<footer class="note"><p>{{DISC}}</p><p>{{PRIV}}</p><p>© 2026 问透 Wentou · <a href="/llms.txt">llms.txt</a></p></footer>
<script>const L={{LJSON}};</script><script src="/offline.js"></script>
<script>
const $=id=>document.getElementById(id);const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
// 语言：记住手动选择；首次访问按浏览器语言自动切换（爬虫除外）
$('sw').onclick=()=>localStorage.setItem('wentou_lang',$('sw').dataset.l);
(()=>{const pref=localStorage.getItem('wentou_lang'),nav=(navigator.language||'').toLowerCase(),bot=/bot|crawl|spider|slurp/i.test(navigator.userAgent);
 if(bot||location.hash==='#demo')return;const want=pref||(nav.startsWith('zh')?'zh':'en');if(want!==L.lang)location.replace((want==='en'?'/en/':'/')+location.search);})();
const TCLS={"易混概念":"confuse","推理跳跃":"jump","结论无理由":"noreason","术语未定义":"undef","绝对化表述":"abs","自标疑问":"self","事实可能有误":"confuse"};
$('legend').innerHTML=Object.keys(L.types).map(t=>`<span class="tag t-${TCLS[t]}">${L.types[t]}</span>`).join('');
let LLM=false,lspots=null,subj='',noteLang='';
fetch('/api/status').then(r=>r.json()).then(d=>{LLM=d.llm&&d.global_ok&&d.free_left>0;$('quota').textContent=d.free_per_day;
 $('mode').textContent=(!d.llm?L.m_off:!d.global_ok?L.m_cap:d.free_left<=0?L.m_quota:fmt(L.m_ai,{n:d.free_left}))+(LLM?'':L.offnote);}).catch(()=>{$('mode').textContent=L.m_nobe+L.offnote;});
async function api(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}
function fallback(e){$('mode').textContent='⚠️ '+e.message+L.fallback+L.offnote;LLM=false;lspots=null;}
const loadTxt=f=>fetch(f).then(r=>r.text()).then(t=>$('notes').value=t);
$('loadSample').onclick=()=>loadTxt('/sample_notes.md');$('loadSample2').onclick=()=>loadTxt('/sample_notes_2.md');$('loadSample3').onclick=()=>loadTxt('/sample_notes_en.md');
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;$('fst').textContent='…';const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f);});
 try{const d=await api('/api/extract',{mime:f.type,data});$('notes').value=d.text;$('fst').textContent='✓ '+d.method;}catch(e){$('fst').textContent='✗ '+e.message;}};
function renderLLM(text,sp){lspots=sp;const pos=sp.map(s=>({s,i:text.indexOf(s.quote)})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i);let h="",p=0;
 pos.forEach(x=>{if(x.i<p)return;const n=sp.indexOf(x.s);h+=esc(text.slice(p,x.i))+`<mark class="t-${TCLS[x.s.type]||'jump'}" title="${esc(L.types[x.s.type]||x.s.type)}: ${esc(x.s.reason)}">[${n+1}] ${esc(x.s.quote)}</mark>`;p=x.i+x.s.quote.length;});
 $('hl').innerHTML=h+esc(text.slice(p));$('cnt').textContent=fmt(L.count,{n:sp.length,subj:subj});
 $('qs').innerHTML=sp.map((s,i)=>`<div class="card" id="sp${i}"><b>[${i+1}] ${esc(s.concept)}</b> <span class="tag t-${TCLS[s.type]||'jump'}">${esc(L.types[s.type]||s.type)}</span><div class="note">${L.orig}${esc(s.quote)}<br>${L.why}${esc(s.reason)}</div>`+s.questions.map((q,j)=>`<div class="q">Q${j+1}. ${esc(q.q)}<input id="a${i}_${j}" placeholder="${esc(L.ansph)}"></div>`).join("")+`</div>`).join("");
 $('s2').hidden=$('s3').hidden=false;$('s4').hidden=true;}
async function judgeLLM(){const items=lspots.map((s,i)=>({...s,answers:s.questions.map((q,j)=>$(`a${i}_${j}`).value)}));
 $('list').innerHTML=L.judging;$('s4').hidden=false;const d=await api('/api/judge',{items,lang:noteLang});const R=d.results;const cls={"已掌握":"ok","部分理解":"mid","未理解":"bad"};
 const todo=R.filter(r=>r.level!=="已掌握");
 $('list').innerHTML=`<p>${esc(d.summary)}</p><p>${fmt(L.sum,{n:R.length,m:R.length-todo.length,t:todo.length})}</p><table><tr>${L.th.map(x=>`<th>${x}</th>`).join('')}</tr>`+R.map(r=>{const s=lspots[r.index]||{};return `<tr><td>${r.index+1}</td><td>${esc(s.concept||'')}</td><td class="${cls[r.level]}">${L.levels[r.level]||r.level}</td><td>${esc(r.feedback)}<br><span class="note">${L.stick}${esc(r.sticking_point)}</span></td><td>${r.ask_teacher.map(esc).join('<br>')}<br><span class="note">${esc(r.review)}</span></td></tr>`}).join("")+"</table>";
 $('md').textContent=L.md_h+"\n\n"+todo.map(r=>{const s=lspots[r.index];return `## ${s.concept} (${L.levels[r.level]})\n- ${L.md_o}: ${s.quote}\n- ${L.md_s}: ${r.sticking_point}\n- ${L.md_a}: ${r.ask_teacher.join('; ')}\n- ${L.md_r}: ${r.review}\n`}).join("\n");$('s4').scrollIntoView();}
$('analyze').onclick=async()=>{const t=$('notes').value;if(t.length>6000){alert(L.toolong);return;}
 if(LLM){$('cnt').textContent='';$('hl').textContent=L.analyzing;$('s2').hidden=false;$('s3').hidden=$('s4').hidden=true;
  try{const d=await api('/api/analyze',{text:t});subj=d.subject;noteLang=d.language;
   if(!d.is_psychology){lspots=null;$('hl').textContent='ℹ️ '+(d.notice||'Psychology notes only.');return;}
   return renderLLM(t,d.spots);}catch(e){fallback(e);}}
 render(t);};
$('judge').onclick=async()=>{if(lspots){try{return await judgeLLM();}catch(e){fallback(e);render($('notes').value);}}judge();};
$('exp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('md').textContent);
$('demo').onclick=demo;
let fbSent=false;async function sendFb(u){if(fbSent)return;try{await api('/api/feedback',{useful:u,comment:$('fbC').value,spots:(lspots||spots||[]).length,mode:(lspots?'llm':'offline')+'-'+L.lang});fbSent=true;$('fbS').textContent=L.thanks;}catch(e){$('fbS').textContent=L.fbfail+e.message;}}
$('fbY').onclick=()=>sendFb(true);$('fbN').onclick=()=>sendFb(false);
if(location.hash==="#demo")demo();
</script></body></html>
